<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SoundMood - Registro</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      background-color: #0e0e10;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .container {
      background-color: #1a1a1d;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
      width: 350px;
      text-align: center;
    }

    h1 {
      color: #a259ff;
      margin-bottom: 20px;
    }

    input {
      width: 95%;
      padding: 10px;
      margin-bottom: 15px;
      border: none;
      border-radius: 5px;
      background-color: #26262b;
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #6a40ff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #5a32e5;
    }

    a {
      color: #a259ff;
      text-decoration: none;
      font-size: 14px;
    }

    .error {
      color: #ff4b5c;
      margin-top: 10px;
    }

    .success {
      color: #28a745;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <canvas id="background" style="position: fixed; top: 0; left: 0; z-index: -1;"></canvas>
  <div class="container">
    <h1>Crear cuenta</h1>
    <form action="/registro" method="POST">
      <input type="text" name="nombre" placeholder="Nombre completo" required />
      <input type="email" name="correo" placeholder="Correo electrónico" required />
      <input type="password" name="contrasena" placeholder="Contraseña" required />
      <button type="submit">Registrarse</button>
    </form>
    <div class="links">
      <a href="/login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
    <div id="message"></div>
  </div>

  <script>

    // Partículas animadas
    const canvas = document.getElementById("background");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    for (let i = 0; i < 100; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 3 + 1,
        dx: (Math.random() - 0.5) * 0.5,
        dy: (Math.random() - 0.5) * 0.5,
      });
    }
    
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#8f94fb";
      particles.forEach((p) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
      });
      requestAnimationFrame(animate);
    }

    animate();

    const params = new URLSearchParams(window.location.search);
    const messageDiv = document.getElementById('message');
    if (params.get("success") === "1") {
      messageDiv.innerHTML = '<p class="success">¡Registro exitoso! Ahora puedes iniciar sesión.</p>';
    }
    if (params.get("error") === "1") {
      messageDiv.innerHTML = '<p class="error">Ese correo ya está registrado.</p>';
    }

  </script>
</body>
</html>
