<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagar Carrito</title>
  <link rel="stylesheet" href="css/comprar.css">
</head>
<body>
  <div class="pagar-carrito">
    <h2>Pagar Carrito</h2>
    <div class="datos-envio">
      <h3>Datos de envío</h3>
      <input type="text" placeholder="País">
      <input type="text" placeholder="Ciudad">
      <input type="text" placeholder="Dirección">
      <input type="text" placeholder="Referencias">
      <button onclick="guardarDatosEnvio()">Guardar</button>
    </div>

    <!-- Sección de método de pago -->
    <div class="forma-pago">
      <h3>Forma de pago</h3>
      <input type="radio" id="efectivo" name="pago" value="efectivo" onchange="mostrarFormularioPago()">
      <label for="efectivo">Efectivo</label><br>
      <input type="radio" id="pse" name="pago" value="pse" onchange="mostrarFormularioPago()">
      <label for="pse">PSE</label><br>
     
    </div>

    <!-- Formulario de pago en efectivo -->
    <div id="forma-pago-efectivo" class="payment-form" style="display:none;">
      <h3>Pago en Efectivo</h3>
      <p>Selecciona un corresponsal:</p>
      <select>
        <option value="corresponsal1">Corresponsal 1</option>
        <option value="corresponsal2">Corresponsal 2</option>
        <option value="corresponsal3">Corresponsal 3</option>
      </select>
      <button onclick="pagarEfectivo()">Pagar en Corresponsal</button>
    </div>

    <!-- Formulario de pago con PSE -->
    <div id="forma-pago-pse" class="payment-form" style="display:none;">
      <h3>Pago con PSE</h3>
      <!-- Redirigir al usuario a la página de pago con PSE -->
      <button onclick="window.location.href = 'https://www.pse.com.co/persona;'">Pagar con PSE</button>
    </div>

  

    <!-- Sección de resumen del carrito -->
    <div class="resumen-carrito">
      <h3>Resumen del carrito</h3>
      <div class="vinilos-carrito">
        <img src="img/week1.jpg" alt="Vinilo 1">
        <img src="img/album2.jpg" alt="Vinilo 2">
        <img src="img/albumw3.jpeg" alt="Vinilo 3">
        <span class="ver-mas" onclick="verMas()">Ver más +</span>
      </div>
      <p>Subtotal: $10</p>
      <p>Envío: $5</p>
      <p>Total: $15</p>
      <button class="pagar-btn" onclick="pagar()">Pagar</button>
    </div>
  </div>

  <script src="js/comprar.js"></script>

</body>
</html>
