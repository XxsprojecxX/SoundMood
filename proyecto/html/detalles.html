<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalles del producto</title>
  <link rel="stylesheet" href="css/detalles.css">
</head>
<body>
  <div class="container">
    <h1>Detalles del producto</h1>
    <section class="datos-producto">
      <h2>Datos del producto</h2>
      <input type="text" id="nombre" placeholder="Nombre ">
      <input type="text" id="artista" placeholder="Artista">
      <label for="fecha">Fecha de salida al mercado:</label>
      <input type="date" id="fecha">
      <h3>Tipo de producto</h3>
      <input type="radio" id="cancion" name="tipoProducto" value="cancion" checked>
      <label for="cancion">Canción</label>
      <input type="radio" id="disco" name="tipoProducto" value="disco">
      <label for="disco">Disco</label>
      <h3>Canciones del disco</h3>
      <div id="canciones">
        <div class="cancion">
          <input type="text" placeholder="Nombre de la canción">
          <input type="text" placeholder="Duración">
        </div>
      </div>
      <button onclick="agregarCancion()">Agregar canción</button>
      <input type="file" id="portada" accept="image/*">
      <button onclick="guardarProducto()">Guardar</button>
    </section>
  </div>

  <script src="js/detalles.js"></script>
</body>
</html>

<!-- El patrón Factory Method se utiliza cuando necesitas crear 
objetos de diferentes tipos, pero quieres ocultar la lógica de creación de esos objetos del cliente. En este caso, tenemos dos tipos de productos: canciones y discos.

Problema:
Cuando el usuario quiere agregar un producto (ya sea una canción o un disco) desde el formulario, necesitamos crear el objeto correspondiente al tipo de producto seleccionado.

Solución:

Definimos una interfaz Producto que define las propiedades comunes que tendrán tanto las canciones como los discos.
Creamos dos clases: Cancion y Disco, que implementan la interfaz Producto.
Definimos una clase ProductoFactory que tiene un método estático crearProducto. Este método recibe como parámetro el tipo de producto que se desea crear, junto con los datos necesarios para crear ese producto (nombre, artista, fecha, etc.).
En función del tipo de producto que se quiere crear, el método crearProducto de la clase ProductoFactory instancia y devuelve el objeto correspondiente (una instancia de Cancion si el tipo es "cancion", o una instancia de Disco si el tipo es "disco").
-->
