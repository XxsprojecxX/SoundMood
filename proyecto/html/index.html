<!DOCTYPE html>
<html lang="es">  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundMood - Login</title>
    <style>
    body {
      background-color: #0e0e10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }
    
    .container {
      background-color: #1a1a1d;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      width: 350px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
    }
    
    .logo img {
      width: 80px;
      height: 80px;
      margin-bottom: 10px;
    }
    
    h1 {
      font-size: 24px;
      font-weight: bold;
      color: #a259ff;
    }
    
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    
    label {
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }
    
    input {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: none;
      background-color: #26262b;
      color: white;
    }
    
    .login-btn {
      width: 100%;
      padding: 10px;
      background-color: #6a40ff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    
    .login-btn:hover {
      background-color: #5a32e5;
    }
    
    .links {
      margin-top: 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    
    .links a {
      color: #a259ff;
      text-decoration: none;
    }
    
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="SoundMood Logo">
        </div>
        
        <h1>SoundMood</h1>
        
        <form>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="login-btn">Iniciar sesión</button>
            
            <div class="links">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <a href="#">Regístrate</a>
            </div>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
