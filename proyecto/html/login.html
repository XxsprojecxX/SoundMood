<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SoundMood - Login</title>
  <link rel="icon" type="image/png" href="Imagenes/SoundMood_Icono.png"/>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #0e0e10;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .container {
      background-color: #1a1a1d;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 350px;
    }

    .logo {
      width: 120px;
      height: auto;
      margin-bottom: -30px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: bold;
      background: linear-gradient(to right, #a29bfe, #4b3bc1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    input {
      width: 95%;
      padding: 10px;
      margin-bottom: 15px;
      border: none;
      border-radius: 5px;
      background-color: #26262b;
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #6a40ff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #5a32e5;
    }

    a {
      color: #a259ff;
      text-decoration: none;
      font-size: 14px;
    }

    a:hover {
      text-decoration: underline;
    }

    .links {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <canvas id="background"></canvas>

  <div class="container">
    <!-- Logo -->
    <img src="Imagenes/SoundMood_Icono.png" alt="SoundMood Logo" class="logo" />
    <h1>SoundMood</h1>
    <h2>Inicia sesión</h2>
    <form action="/login" method="POST">
      <input type="email" name="correo" placeholder="Correo electrónico" required />
      <input type="password" name="contrasena" placeholder="Contraseña" required />
      <button type="submit">Iniciar sesión</button>
    </form>
    <div class="links">
      <a href="#">¿Olvidaste tu contraseña?</a><br>
      <a href="/registro.html">Regístrate</a>
    </div>
  </div>

  <script>
    // Partículas animadas
    const canvas = document.getElementById("background");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    for (let i = 0; i < 100; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 3 + 1,
        dx: (Math.random() - 0.5) * 0.5,
        dy: (Math.random() - 0.5) * 0.5,
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#8f94fb";
      particles.forEach((p) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
      });
      requestAnimationFrame(animate);
    }

    animate();

    const params = new URLSearchParams(window.location.search);
    if (params.get("error") === "1") {
      const errorMsg = document.createElement("p");
      errorMsg.textContent = "Correo o contraseña incorrectos.";
      errorMsg.style.color = "#ff4b5c";
      errorMsg.style.marginTop = "15px";
      document.querySelector(".container").appendChild(errorMsg);
    }
  </script>
</body>
</html>
