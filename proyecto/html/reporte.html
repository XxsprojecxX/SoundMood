<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reporte de Estados de Ánimo</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0e0e10;
      font-family: 'Arial', sans-serif;
      color: white;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .reporte-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 100vh;
    }

    .reporte-box {
      background-color: #1a1a1d;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 800px;
    }

    h1 {
      text-align: center;
      color: #ffa959;
      margin-bottom: 30px;
      font-size: 2.2rem;
      background: linear-gradient(135deg, #ffa959, #a259ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    form {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    input[type="date"] {
      background-color: #2b2b2f;
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      color: white;
      font-size: 16px;
      width: 160px;
    }

    button {
      background: linear-gradient(135deg, #ffa959, #a259ff);
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      font-weight: bold;
      letter-spacing: 1px;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(255, 169, 89, 0.6);
    }

    canvas {
      max-width: 100%;
      height: auto !important;
      background-color: rgba(255,255,255,0.03);
      border-radius: 15px;
      padding: 10px;
    }

    #moodChart,
    #resultado-reporte {
      display: none;
    }

    #resultado-reporte {
      margin-top: 30px;
      background-color: #2b2b2f;
      padding: 20px;
      border-radius: 15px;
      font-size: 17px;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 0 10px rgba(162, 89, 255, 0.2);
    }

    #volver-btn {
      margin-top: 20px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      padding: 10px 25px;
      font-size: 16px;
      border-radius: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      form {
        flex-direction: column;
        align-items: center;
      }

      input[type="date"],
      button {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>

  <div id="particles-js"></div>

  <div class="reporte-container">
    <div class="reporte-box">
      <h1>¿Quieres saber cómo te has sentido últimamente?</h1>
      <form id="formReporte">
        <input type="date" name="fechaInicio" required />
        <input type="date" name="fechaFin" required />
        <button type="submit">Generar Reporte</button>
      </form>

      <canvas id="moodChart"></canvas>

      <div id="resultado-reporte"></div>

      <button id="volver-btn" onclick="history.back()">
        ← Volver
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 50 },
        color: { value: ["#ffffff", "#a259ff", "#ffa959"] },
        shape: { type: "circle" },
        opacity: {
          value: 0.4,
          anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false }
        },
        size: {
          value: 3,
          random: true
        },
        line_linked: {
          enable: true,
          distance: 120,
          color: "#a259ff",
          opacity: 0.3,
          width: 1
        },
        move: {
          enable: true,
          speed: 1.2,
          direction: "none",
          out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "grab" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          grab: { distance: 150, line_linked: { opacity: 0.6 } },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>

  <script>
    const form = document.getElementById("formReporte");
    const ctx = document.getElementById("moodChart").getContext("2d");
    let chartInstance = null;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const fechaInicio = formData.get("fechaInicio");
      const fechaFin = formData.get("fechaFin");

      try {
        const res = await fetch("/reporte-mood", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fechaInicio, fechaFin })
        });

        const datos = await res.json();

        if (chartInstance) chartInstance.destroy();

        if (datos.datos && datos.datos.length > 0) {
          const labels = datos.datos.map(e => e.estado);
          const data = datos.datos.map(e => parseFloat(e.porcentaje));

          const estadoColores = {
            feliz: "#f1c40f",
            triste: "#3498db",
            relajado: "#2ecc71",
            energetico: "#e67e22"
          };

          const fondoColores = labels.map(e => estadoColores[e] || "#95a5a6");

          chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
              labels,
              datasets: [{
                label: 'Porcentaje',
                data,
                backgroundColor: fondoColores,
              }]
            },
            options: {
              responsive: true,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: (ctx) => `${labels[ctx.dataIndex]}: ${data[ctx.dataIndex]}%`
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: "#333" }
                },
                x: {
                  grid: { color: "#333" }
                }
              }
            }
          });

          const emojis = {
            feliz: "😄",
            triste: "😢",
            relajado: "😌",
            energetico: "💪"
          };

          const emoji = emojis[datos.estadoPrincipal] || "🙂";

          document.getElementById("resultado-reporte").innerHTML = `
            <strong>Estado más frecuente:</strong> ${emoji} 
            <span style="text-transform: uppercase;">${datos.estadoPrincipal}</span><br>
            <em>${datos.frase}</em>
          `;

          // Mostrar los cuadros
          document.getElementById("moodChart").style.display = "block";
          document.getElementById("resultado-reporte").style.display = "block";

        } else {
          alert("No se encontraron estados para el rango seleccionado.");
          document.getElementById("resultado-reporte").innerText = "";
          document.getElementById("moodChart").style.display = "none";
          document.getElementById("resultado-reporte").style.display = "none";
        }

      } catch (err) {
        console.error("Error generando el reporte:", err);
        alert("Ocurrió un error generando el reporte.");
      }
    });
  </script>
</body>
</html>
