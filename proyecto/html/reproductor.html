<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reproductor - SoundMood</title>
  <link rel="stylesheet" href="css/estilos-mood.css" />
  <link rel="icon" type="image/png" href="Imagenes/SoundMood_Icono.png"/>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0e0e10;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }
    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 80px);
      padding: 20px;
      box-sizing: border-box;
    }
    .player {
      width: 100%;
      max-width: 600px;
      background: rgba(30, 30, 30, 0.6);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }
    .player-cover img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.4s ease;
    }
    .player-cover img:hover {
      transform: scale(1.03);
    }
    .song-title {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .song-artist {
      color: #b2bec3;
      margin-bottom: 10px;
    }
    .player-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }
    .control-btn {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }
    .control-btn:hover {
      background: #4f0ca7;
      transform: scale(1.1);
    }
    .play-btn {
      background: linear-gradient(135deg, #fdcb6e, #e17055);
      font-size: 2.3rem;
      box-shadow: 0 4px 15px rgba(253, 203, 110, 0.4);
    }
    .progress-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      margin: 30px 0 10px;
      cursor: pointer;
    }
    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #fdcb6e, #e17055);
      border-radius: 5px;
      transition: width 0.2s;
    }
    .time-info {
      display: flex;
      justify-content: space-between;
      color: #b2bec3;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .wave-animation {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      gap: 4px;
      height: 30px;
      align-items: flex-end;
    }
    .wave-bar {
      width: 3px;
      background: #fdcb6e;
      border-radius: 3px;
      animation: wave 1s infinite ease-in-out;
    }
    .wave-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { height: 60%; animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { height: 100%; animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { height: 60%; animation-delay: 0.4s; }
    .wave-bar:nth-child(5) { height: 40%; animation-delay: 0.5s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.5); }
    }
    .btn-volver {
      position: absolute;
      left: 40px;
      top: 40px;
      background: linear-gradient(135deg, #4f0ca7, #a659ff);
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .btn-volver:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <!-- NAVBAR -->

      </div>
      <div class="logo-text">Bienvenido a SoundMood 🎶</div>
    </div>
    <div id="saludo">Cargando...</div>
    <div class="nav-links">
      <a href="mood.html">¿Cambiaste de Ánimo?</a>

      <a href="login.html">Cerrar sesión</a>
    </div>
  </nav>
  <main>
    <div class="player">
      <button class="btn-volver" onclick="history.back()">← Volver</button>
  
      <div class="player-cover">
        <img id="cover" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=500&q=80" alt="Portada">
      </div>
      <div class="song-title" id="title">Título</div>
      <div class="song-artist" id="artist">Artista</div>
  
      <div class="progress-container" onclick="setProgress(event)">
        <div class="progress" id="progressBar"></div>
      </div>
  
      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
  
      <div class="player-controls">
        <button class="control-btn" onclick="prevSong()">⏮</button>
        <button class="control-btn play-btn" onclick="togglePlay()" id="playBtn">▶</button>
        <button class="control-btn" onclick="nextSong()">⏭</button>
      </div>
  
      <div class="wave-animation" id="waveAnim">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
    </div>
  </main>
  
  <audio id="audio"></audio>
  
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles", {
      particles: {
        number: { value: 40 },
        color: { value: ["#ffffff", "#a259ff", "#ffa959"] },
        shape: { type: "circle" },
        opacity: { value: 0.4 },
        size: { value: 4 },
        line_linked: {
          enable: true,
          distance: 120,
          color: "#a259ff",
          opacity: 0.3,
          width: 1
        },
        move: {
          enable: true,
          speed: 1.2,
          out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "grab" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          grab: { distance: 150, line_linked: { opacity: 0.6 } },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  
    const audios = document.getElementById('audio');
    const playBtno = document.getElementById('playBtn');
    const progressBarr = document.getElementById('progressBar');
    const currentTimeEll = document.getElementById('currentTime');
    const durationEll = document.getElementById('duration');
    const waveAniml = document.getElementById('waveAnim');
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const coverEl = document.getElementById('cover');
  
    const songsTristes = [
  {
    title: "Walking on Sunshine",
    artist: "Katrina & The Waves",
    cover: "https://images.unsplash.com/photo-1496307653780-42ee777d4833?auto=format&fit=crop&w=500&q=80",
    src: "musica/triste/Cancion Optimista 1.mp3"
  },
  {
    title: "Here Comes the Sun",
    artist: "The Beatles",
    cover: "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=500&q=80",
    src: "musica/triste/Cancion Optimista 2.mp3"
  },
  {
    title: "Brave",
    artist: "Sara Bareilles",
    cover: "https://images.unsplash.com/photo-1508780709619-79562169bc64?auto=format&fit=crop&w=500&q=80",
    src: "musica/triste/Cancion Optimista 3.mp3"
  }
];

const songsFelices = [
  {
    title: "Happy",
    artist: "Pharrell Williams",
    cover: "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=500&q=80",
    src: "musica/feliz/Cancion Feliz 1.mp3"
  },
  {
    title: "Can't Stop the Feeling!",
    artist: "Justin Timberlake",
    cover: "https://images.unsplash.com/photo-1487180144351-b8472da7d491?auto=format&fit=crop&w=500&q=80",
    src: "musica/feliz/Cancion Feliz 2.mp3"
  },
  {
    title: "Don't Stop Me Now",
    artist: "Queen",
    cover: "https://images.unsplash.com/photo-1527261834078-9b37d35a4a32?auto=format&fit=crop&w=500&q=80",
    src: "musica/feliz/Cancion Feliz 3.mp3"
  }
];

const songsEnergeticos = [
  {
    title: "Can't Stop the Feeling!",
    artist: "Justin Timberlake",
    cover: "https://images.unsplash.com/photo-1527261834078-9b37d35a4a32?auto=format&fit=crop&w=500&q=80",
    src: "musica/energetico/Cancion Energetico 1.mp3"
  },
  {
    title: "Stronger",
    artist: "Kanye West",
    cover: "https://images.unsplash.com/photo-1558021212-51b6ecfa0db9?auto=format&fit=crop&w=500&q=80",
    src: "musica/energetico/Cancion Energetico 2.mp3"
  },
  {
    title: "Don't Stop Me Now",
    artist: "Queen",
    cover: "https://images.unsplash.com/photo-1487180144351-b8472da7d491?auto=format&fit=crop&w=500&q=80",
    src: "musica/energetico/Cancion Energetico 3.mp3"
  }
];

const songsRelajados = [
  {
    title: "Weightless",
    artist: "Marconi Union",
    cover: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=500&q=80",
    src: "musica/relajado/Cancion Relajado 1.mp3"
  },
  {
    title: "Breathe Me",
    artist: "Sia",
    cover: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80",
    src: "musica/relajado/Cancion Relajado 2.mp3"
  },
  {
    title: "Sunset Lover",
    artist: "Petit Biscuit",
    cover: "https://images.unsplash.com/photo-1519677100203-a0e668c92439?auto=format&fit=crop&w=500&q=80",
    src: "musica/relajado/Cancion Relajado 3.mp3"
  }
];
const estadoMood = localStorage.getItem("estadoAnimo");
switch (estadoMood) {
  case "feliz":
          songs = songsFelices;
          break;
        case "triste":
          songs = songsTristes;
          break;
        case "relajado":
          songs = songsRelajados;
          break;
        case "energetico":
          songs = songsEnergeticos;
          break;
        default:
          break;
      }

    let currentIndex = 0;
    let isPlaying = false;
  
    function loadSong(index) {
      const song = songs[index];
      titleEl.textContent = song.title;
      artistEl.textContent = song.artist;
      coverEl.src = song.cover;
      audios.src = song.src;
      progressBarr.style.width = '0%';
      currentTimeEll.textContent = "0:00";
      durationEll.textContent = "0:00";
      if (isPlaying) {
        audios.play();
      }
    }
  
    function togglePlay() {
      if (isPlaying) {
        audios.pause();
        playBtno.textContent = "▶";
        waveAniml.style.opacity = 0.3;
      } else {
        audios.play();
        playBtno.textContent = "⏸";
        waveAniml.style.opacity = 1;
      }
      isPlaying = !isPlaying;
    }
  
    function prevSong() {
      currentIndex = (currentIndex - 1 + songs.length) % songs.length;
      loadSong(currentIndex);
      if (!isPlaying) togglePlay();
    }
  
    function nextSong() {
      currentIndex = (currentIndex + 1) % songs.length;
      loadSong(currentIndex);
      if (!isPlaying) togglePlay();
    }
  
    audios.addEventListener('timeupdate', () => {
      const { currentTime, duration } = audios;
      if (duration) {
        const percent = (currentTime / duration) * 100;
        progressBarr.style.width = `${percent}%`;
        currentTimeEll.textContent = formatTime(currentTime);
        durationEll.textContent = formatTime(duration);
      }
    });
  
    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${min}:${sec}`;
    }
  
    function setProgress(e) {
      const width = e.currentTarget.clientWidth;
      const clickX = e.offsetX;
      const duration = audios.duration;
      audios.currentTime = (clickX / width) * duration;
    }
  
    fetch("/usuario-info")
      .then(res => res.json())
      .then(data => {
        document.getElementById("saludo").textContent = `¡Hola, ${data.nombre}!`;
      })
      .catch(() => {
        document.getElementById("saludo").textContent = "Bienvenido.";
      });
  
    loadSong(currentIndex);
  </script>
  </main>

      </div>
    </div></main>

  <script>
    const estado = localStorage.getItem("estadoAnimo");
    if (estado) {
      document.body.classList.add(estado);
    }

<script>


  if (estadoMood) {
    document.body.classList.add(estadoMood);

    // Mapeo de colores de partículas por estado
const particleColors = {
  feliz: "rgba(255, 223, 100, 0.3)",           // Amarillo cálido
  relajado: "rgba(120, 150, 255, 0.3)",         // Azul suave
  energetico: "rgba(255, 102, 0, 0.3)",         // Naranja fuerte
  "triste-optimista": "rgba(108, 92, 231, 0.3)" // Violeta tranquilo
};

const colorParticula = particleColors[estadoMood] || "rgba(162, 89, 255, 0.3)"; // por defecto

const particlesContainer = document.getElementById("particles");
const particleCount = 30;

for (let i = 0; i < particleCount; i++) {
  const particle = document.createElement("div");
  particle.classList.add("particle");

  particle.style.left = Math.random() * 100 + "%";
  particle.style.top = Math.random() * 100 + "%";
  particle.style.width = (Math.random() * 6 + 3) + "px";
  particle.style.height = particle.style.width;
  particle.style.opacity = Math.random() * 0.6;
  particle.style.animationDelay = Math.random() * 15 + "s";
  particle.style.animationDuration = (Math.random() * 15 + 15) + "s";
  particle.style.background = colorParticula;

  particlesContainer.appendChild(particle);
}

    // Cambiar color de fondo y título según mood
    const playlistContainer = document.querySelector("body");
    const playlistTitle = document.querySelector(".playlist-title");

    switch (estadoMood) {
      case "feliz":
        playlistContainer.style.background = "linear-gradient(to bottom, #f2f538, #ff9751)";
        playlistTitle.style.color = "#ff8c42";
        break;
      case "triste":
        playlistContainer.style.background = "linear-gradient(to right, #d35f5f, #6836f1)";
        playlistTitle.style.color = "#f8c471";
        break;
      case "relajado":
        playlistContainer.style.background = "linear-gradient(to right, #3f5ba8, #a244ffed)";
        playlistTitle.style.color = "#74b9ff";
        break;
      case "energetico":
        playlistContainer.style.background = "linear-gradient(to right, #ff6a00, #ffcc00)";
        playlistTitle.style.color = "#ff6a00";
        break;
      default:
        break;
    }
  }
</script>
